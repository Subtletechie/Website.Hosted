[project]
name = "subtlescan"
version = "0.1.0"
description = "Read-only cloud security assessment for SMB Azure and AWS environments"
readme = "README.md"
authors = [{ name = "Subtletech" }]
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.25.3",
    "azure-mgmt-resource>=26.0.0",
    "azure-mgmt-resource-subscriptions>=1.0.0",
    "azure-mgmt-storage>=25.2.0",
    "fastapi>=0.142.2",
    "jinja2>=3.1.6",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
subtlescan = "subtlescan.cli:app"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src/subtlescan/models", "src/subtlescan/scoring"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
