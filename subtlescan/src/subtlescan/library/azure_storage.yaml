# Curated client-facing text. Keep business_impact to plain English an owner can act on.
AZ-STG-001:
  title: Storage account allows anonymous public access to files
  effort: S
  business_impact: >
    Anyone on the internet who guesses or finds a link could download files from this storage
    account without logging in. If it holds customer records, invoices, or backups, that is a
    reportable data leak.
  remediation: |
    Portal: Storage account → Settings → Configuration → set "Allow Blob anonymous access" to Disabled → Save. Before switching, check whether a public website or app relies on anonymous links, and move it to SAS links or Azure Front Door.
    CLI: az storage account update -g <resource-group> -n <account> --allow-blob-public-access false
  terraform_fix: |
    resource "azurerm_storage_account" "this" {
      # ...
      allow_nested_items_to_be_public = false
    }

AZ-STG-002:
  title: Storage account still accepts account keys (shared key access)
  effort: M
  business_impact: >
    Account keys are master passwords to everything in the storage account. They never expire,
    are often pasted into scripts and config files, and a single leaked key gives full read and
    delete access with no record of who used it.
  remediation: |
    1. Find what still uses keys: Storage account → Monitoring → Metrics → Transactions, split by "Authentication", filter to "AccountKey" over the last 7 days.
    2. Move those apps to Microsoft Entra ID (managed identity + "Storage Blob Data" roles).
    3. Portal: Storage account → Settings → Configuration → "Allow storage account key access" → Disabled.
    CLI: az storage account update -g <resource-group> -n <account> --allow-shared-key-access false
  terraform_fix: |
    resource "azurerm_storage_account" "this" {
      # ...
      shared_access_key_enabled       = false
      default_to_oauth_authentication = true
    }

AZ-STG-003:
  title: Deleted files in storage cannot be recovered (soft delete off or too short)
  effort: S
  business_impact: >
    If ransomware, a compromised account, or a staff mistake deletes or overwrites files here,
    they are gone for good. Soft delete keeps a recoverable copy for a set number of days at
    very low cost.
  remediation: |
    Portal: Storage account → Data management → Data protection → enable "soft delete for blobs" (14+ days recommended), "soft delete for containers", and "versioning for blobs" → Save.
    CLI: az storage account blob-service-properties update -g <resource-group> --account-name <account> \
         --enable-delete-retention true --delete-retention-days 14 \
         --enable-container-delete-retention true --container-delete-retention-days 14 \
         --enable-versioning true
  terraform_fix: |
    resource "azurerm_storage_account" "this" {
      # ...
      blob_properties {
        versioning_enabled = true
        delete_retention_policy {
          days = 14
        }
        container_delete_retention_policy {
          days = 14
        }
      }
    }
